name: Release

# Pushing a version tag verifies the release: the tag must match the versions in the repo, and both the
# Python code and the npm launcher must pass their tests. Publishing to npm is done by hand by the owner.
# Publishing to PyPI only runs if the repository variable PUBLISH_PYPI is set to "true".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.3.0
      - name: The tag must match the versions in the repo
        run: python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Install ffmpeg, which the camera picture tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Run the Python tests
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/python -m pytest -q
      - name: Run the launcher tests
        run: npm test
      - name: Check that the npm package packs
        run: npm pack --dry-run
      - name: Build the Python package
        run: uv build
      - name: Check the Python package page
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tolpo/
    permissions:
      id-token: write # trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
