[project]
name = "tolpo"
version = "0.1.0"
description = "Local-first HTTP API that lets AI agents read and control smart-home devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-kasa>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3",
]

[project.urls]
Repository = "https://github.com/signerless/tolpo"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tolpo = "tolpo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tolpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
